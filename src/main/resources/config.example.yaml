# FirstCode 配置文件示例
# 路径: ~/.firstcode/config.yaml
# (Windows: C:\Users\<user>\.firstcode\config.yaml)

# LLM 后端协议
# - anthropic: Anthropic Claude(原生 Messages API + SSE)
# - openai:    OpenAI 兼容后端(OpenAI 官方、DeepSeek、Qwen、智谱 等)
protocol: anthropic

# 模型名(Anthropic: claude-3-5-sonnet-20241022 / OpenAI: gpt-4o-mini / DeepSeek: deepseek-chat / Qwen: qwen-turbo / 智谱: glm-4-flash)
model: claude-3-5-sonnet-20241022

# API base URL
# Anthropic: https://api.anthropic.com
# OpenAI:    https://api.openai.com/v1
# DeepSeek:  https://api.deepseek.com/v1
# Qwen:      https://dashscope.aliyuncs.com/compatible-mode/v1
# 智谱 GLM:   https://open.bigmodel.cn/api/paas/v4
base_url: https://api.anthropic.com

# API 密钥(填入你自己的 key,本文件勿提交)
api_key: YOUR_API_KEY_HERE

# 可选:启用 extended thinking(仅 protocol: anthropic 生效)
# 取值: enabled | disabled, 默认 disabled
# thinking: enabled
